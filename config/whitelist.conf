; Copy this file for personal rules, so updates do not overwrite your changes.
; Set whitelists.local_whitelist_path in your Slips YAML to the copied file.
; slips.py -c selects that YAML configuration, not this whitelist file.
;
; Write one rule per line. Separate columns with commas, without quoting values.
; The first four columns are required; the fifth is optional.
; Use lowercase type/direction/mode names. Do not add comments after a rule.
; Start explanation lines with ; and disabled rule lines with #.
; A # line tells Slips to remove that matching rule from its whitelist cache.
;
"IoCType","IoCValue","Direction","IgnoreType","EvidenceType"
;
; 1. IoCType: what kind of value to match. IoC means the item being whitelisted.
;    ip: one IPv4 or IPv6 address, optionally with a port condition (see below).
;    domain: a domain name and its subdomains, e.g. example.com, without https://.
;    organization: known IP ranges, domains and ASNs of a supported organization.
;      Supported names: google, microsoft, apple, facebook, twitter.
;    mac: a MAC address, e.g. a1:a2:a3:a4:a5:a6; Slips must know that host's MAC.
;    uri: an exact HTTP request path, including its query string if present.
;
; 2. IoCValue: the address, name or request path to match.
;    Plain IP: 1.2.3.4 or 2001:db8::10 matches that address on any port.
;      Use individual addresses; IP subnets/ranges such as 192.168.1.0/24 do not work.
;    IP:port: 1.2.3.4:902 or [2001:db8::10]:902 matches the IP AND its own port.
;      With src this is the SOURCE port; with dst it is the DESTINATION port.
;      With both, the IP and port must match together on either side.
;    *:902: any IP on port 902, on the side selected by Direction.
;      These port forms accept one number from 0 to 65535, without leading zeros.
;      There is no TCP/UDP selector; add separate lines for additional ports.
;    Source IP -> destination port: 192.168.1.163->*:902
;      Match this source connecting to port 902 on ANY destination IP.
;      The source port can be anything. IPv6: [2001:db8::10]->*:902.
;      Requires src,alerts and a destination port from 1 to 65535.
;      The evidence must record the source IP and destination port; ICMP cannot match.
;    Domain: example.com. Organization: one supported name listed above.
;    MAC: a1:a2:a3:a4:a5:a6.
;    URI: /health or /health?check=1, not a full URL, prefix or regular expression.
;      /health does not match /health?check=1. Maximum 256 characters; no commas.
;      Use both,flows (or both,both). URI matching ignores Direction and IP/port;
;      it skips matching request records, not necessarily their parent connections.
;
; 3. Direction: which side must contain the value, not which profile you opened.
;    src: match the source (the host sending the connection/request).
;    dst: match the destination (the host receiving it).
;    both: match either source or destination.
;    Evidence rules use the source/destination roles recorded in the evidence;
;    the host called "attacker" is not necessarily the source.
;
; 4. IgnoreType: what Slips should skip when the rule matches.
;    alerts: keep processing flows; exclude matching evidence from the host score
;      and alert generation. Retained evidence is marked whitelisted/excluded;
;      use Show excluded in the web to inspect it. This is not just hiding a popup.
;    flows: skip matching flow records before detection. They do not produce
;      detections, so use alerts instead if you still want those flows analyzed.
;    both: skip matching flows AND exclude matching evidence from scoring/alerts.
;    blocking: keep flows, evidence, scores and alerts, but do not firewall-block
;      or ARP-poison this IP. Protects that IP, not everyone communicating with it.
;      Requires ip, an individual address, both directions, and no port/EvidenceType.
;
; 5. EvidenceType (optional): limit an alerts rule to one detection type.
;    Only supported for ip rules with IgnoreType alerts. Use the internal name,
;    e.g. UNKNOWN_PORT or ARP_SCAN, not the web label "Unknown port".
;    Names are defined in slips_files/core/structures/evidence.py (EvidenceType).
;    Omit this column or leave it empty to match all evidence types.
;    Every condition on a line must match: IP, selected port and evidence type.
;
; Rules are independent: a narrow exception does not override a broader rule.
; For the same type/value and EvidenceType, the last rule replaces earlier ones,
; even if their directions or modes differ. Adding rules does not delete old alerts.
;
; Examples (remove the leading ; to enable):
; Keep flows, but exclude detections involving this IP on either side:
;ip,1.2.3.4,both,alerts
; Keep detections and alerts, but never block or ARP-poison this host:
;ip,192.168.1.128,both,blocking
; Exclude UNKNOWN_PORT only for this source connecting to destination port 902:
;ip,192.168.1.163->*:902,src,alerts,UNKNOWN_PORT
; Exclude UNKNOWN_PORT only when 1.2.3.4 is the destination on port 902:
;ip,1.2.3.4:902,dst,alerts,UNKNOWN_PORT
; Skip flows from this domain, or skip flows AND detections for an organization:
;domain,google.com,src,flows
;organization,apple,both,both
; Exclude detections for this MAC; skip HTTP records with exactly this URI:
;mac,b1:b1:b1:c1:c2:c3,both,alerts
;uri,/health,both,flows
;
