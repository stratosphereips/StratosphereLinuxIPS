# This configuration file controls several aspects of the working of Slips.
################ 🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨 #########################
##                DO NOT MODIFY THIS FILE. EVER.                                                      #
##      IF YOU NEED TO CHANGE ANYTHING, MAKE A COPY AND USE THAT COPY WITH slips.py -c                #
################ 🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨 #########################

---

update:
  # Enable automatic live updates of the installed Slips version.
  # This setting is separate from the feeds_update_manager module, which only
  # updates TI feeds and related files during runtime.
  # Automatic Slips updates may overwrite the default config files shipped
  # with Slips. If you want to keep your local configuration changes intact, avoid editing the default config files.
  # Instead, create separate config files with different names and use those.
  auto_update_slips: false

  # Select which update channel Slips should auto-update from.
  # Available update channels:
  # - stable:  uses origin/master
  # - unstable: uses origin/develop
  # - testing:  specify your branch name in the testing_branch_to_update_slips_from parameter below.
  channel_to_update_slips_from: stable

  # This branch is used only when channel_to_update_slips_from is set to
  # testing.
  # Must be a remote origin/<branch> ref.
  # Example: origin/your_branch_here
  testing_branch_to_update_slips_from: origin/your_branch_here

output:
  # Define the file names for the default output.
  stdout: slips.log
  stderr: errors.log
  logs: slips.log

#############################
parameters:
  # The verbosity is related to how much data you want to see about the
  # detections.
  verbose: 1

  # The debugging is related to errors, warnings and cases that may cause
  # errors.
  debug: 0

  # The width of the time window (TW) used by Slips. All traffic is separated in
  # TW to be analyzed. This is so old detections can be forgoten.
  # For 1 minute
  # time_window_width : 60
  # For 5 min
#  time_window_width : 300
  # For 1 hour
  time_window_width: 3600
  # For 1 day
  # time_window_width = 86400
  # Make Slips use only one time window (also like if no TW is used)
  # (If you use this, the names of files will use a -100 years for the TW)
  # time_window_width : 'only_one_tw'

  # Export the strato letters used for detecting C&C by the RNN model
  # to the file strato_letters.tsv in the current output directory.
  # These letters are used for re-training the model.
  export_strato_letters: false

  # The 'analysis_direction' has two options: out or all.
  # In 'out' mode, Slips creates a profile for each flow source IP and stores
  # the flow as outgoing from that profile. This applies to supported flows
  # regardless of whether the source or destination IP is private or public.
  # Slips does not create a reverse destination-IP profile for the flow.
  #
  # In 'all' mode, Slips also creates a profile for each flow destination IP
  # and stores the reverse, incoming view of supported connection flows.
  # analysis_direction : all
  analysis_direction: out

  # Delete zeek log files after stopping slips.
  # this parameter deletes arp.log every 1h. useful for saving disk space
  delete_zeek_files: false

  # Store a copy of zeek files in the output dir after the analysis is done.
  # shouldn't be set to yes if delete_zeek_files is set to yes, because if the
  # zeek files
  # are deleted after slips is done, there's no way to store a copy of them
  # anywhere
  store_a_copy_of_zeek_files: false

  # store the generated zeek files in the output dir while the slips is running.
  store_zeek_files_in_the_output_dir: true

  # Create a metadata dir in output/metadata/ that has a copy of slips.yaml,
  # whitelist file, current commit and date
  metadata_dir: true

  # This directory stores databases and runtime-generated files that must
  # persist across different slips runs and should not be overwritten.
  # this dir is inside slips root dir.
  # With -m -f <input> -o <dir>, runtime data uses <dir>/permanent automatically.
  permanent_dir: permanent

  # Default pcap packet filter. Used with zeek pcapfilter : 'ip or not ip'
  # If you want more important traffic and forget the multicast and broadcast
  # traffic, you can use
  # pcapfilter: 'not icmp and not multicast and not broadcast and not arp and
  # not port 5353 and not port 67'
  pcapfilter: ''

  # Defines for Zeek how much is the TCP inactivity timeout.
  # This means when will Zeek consider a TCP connection timeout after no
  # packets are seen?
  # Defined in minutes.
  # Zeek default timeout is 5m, but because sometimes the delay between
  # packets is more than 5 mins, zeek usually breaks the connection into
  # smaller connections, which is not good.
  # Zeek does this to have more data sooner and not to wait 1hs for
  # detections, but the TCP standard defines 1hs.
  tcp_inactivity_timeout: 60

  # Clear the current run's Redis database 0 at startup. Database 1 on
  # port 6379 is the shared cache and is not cleared by this setting.
  # Set false only for workflows that manage Redis state explicitly;
  # it does not preserve the output directory or safely resume a run.
  # Use --keep-history to retain old live-interface detections in SQLite.
  # deletePrevdb : false
  deletePrevdb: true

  # Set the label for all the flows that are being read.
  # For now only normal and malware directly. No option for setting labels
  # with a filter
  # The purpose is to be used in the training of ML models and to output
  # flows with labels for other tools.
  # label: malicious
  # label: unknown
  label: normal
  # determines if Zeek files are rotated or not to avoid running out of disk.
  # Zeek rotation is enabled by default when using an interface,
  # which means Slips will delete all Zeek log files after 1 day
  # of running
  # rotation : false
  rotation: true

  # How often to rotate and delete Zeek files if rotation is enabled.
  # Can be written as a numeric constant followed by a time unit where
  # the time unit is one of usec, msec, sec, min, hr, or day which respectively
  # represent microseconds, milliseconds, seconds, minutes, hours, and days.
  # Whitespace between the numeric constant and time unit is optional.
  # Appending the letter s to the time unit in order to
  # pluralize it is also optional
  # default_rotation_interval: 30min
  # default_rotation_interval: 2hr
  #default_rotation_interval: 30sec
  default_rotation_interval: 1day

  # How many days Slips keeps the rotated Zeek files before deleting them.
  # Value should be in days
  # set it to 0 day if you want to delete them immediately
  # keep_rotated_files_for : 0 day
  # keep_rotated_files_for : 2 day
  keep_rotated_files_for: 1 day

  # How many minutes to wait for all modules to finish before killing them
  # wait_for_modules_to_finish : 15 mins
  # By default 1 week
  wait_for_modules_to_finish: 10080 mins

  # Flows are labeled to normal/malicious by Slips and added to the sqlite
  # db in the output dir.
  export_labeled_flows: false

  # Which format to use for the exported flows
  # Export_format can be tsv or json. this parameter is ignored if
  # export_labeled_flows is set to false
  export_format: json

  # Client IPs are the IPs that Slips will consider to be part of the local
  # network.
  # For example, this can be your own local IP or some computer you’re monitoring
  # When Slips analyses a network interface, the client IP is automatically set as
  # the IP of the interface.
  # It is useful to specify it when analyzing pcaps or Zeek logs.
  # All private client ips should belong to the same local network
  # client_ips : [10.0.0.1, 11.0.0.0/24]
  client_ips: []

# Live-interface raw-flow retention. Detection history has separate limits;
# ordinary raw flows expire sooner than flows linked to non-excluded evidence.
# This does not run when importing a capture file.
flow_retention:
  enabled: true
  ordinary_hours: 24
  # Under size pressure, keep unlinked flows for at least this long so
  # detectors can still attach evidence to recent traffic.
  size_min_age_minutes: 60
  linked_days: 30
  batch_size: 500
  interval_seconds: 60
  # Target logical SQLite size. Under pressure, unlinked flows older than
  # size_min_age_minutes go first; linked flows are ordered by their latest
  # evidence and protected for ordinary_hours after that evidence.
  # 0 disables the size cap.
  max_size_mb: 512

#############################
detection_history:
  enabled: true
  active_days: 90
  # Rotate older details sooner under size pressure, preserving the last day.
  max_active_size_mb: 2048
  min_active_hours: 24
  # Monthly SQLite archives expire 30 days after their last write.
  archive_retention_days: 30
  archive_file_size_mb: 256
  # Expire the oldest completed segments sooner if archives exceed this cap.
  max_archive_size_mb: 4096
  batch_size: 200
  interval_seconds: 10
  work_budget_ms: 250
  min_free_disk_mb: 1024
  # Rotate Slips logs at this size; retain rotated logs for the archive age.
  log_max_size_mb: 64
  log_backup_count: 30

#############################
Debug:
  # Generate latency, throughput, and other performance related CSV files and plots in output/performance_plots/ for debugging
  # When enabled, Slips records extra per-flow/per-minute performance data from
  # input, profiler workers, and evidence handling, then generates summary plots
  # during shutdown. Keep this disabled for normal runs because it adds extra
  # bookkeeping and disk writes.
  #  available options are true/false
  generate_performance_plots: false

#############################
detection:
  # Evidence detection threshold is used for non-live traffic only, such as
  # pcaps and Zeek directories. The alert threshold for one host/time window is
  # evidence_detection_threshold * time_window_width (seconds) / 60.
  # Compare this threshold with the sum of threat value * confidence.
  # It controls how sensitive Slips is.
  # The default 0.25 value gives you balanced detections with
  # the optimal false positive rate and TPR.
  # Here are more options
  #
  # - 0.08: Use this threshold If you want Slips to be super sensitive with
  # higher FPR. Using this means you are less likely to miss a detection but
  # more likely to get false positives
  #
  # - 0.25: Optimal threshold, has the most optimal and balanced FPR and TPR.
  # - 0.43: Use this threshold If you want Slips to be insensitive.
  #        Using this means Slips will need so many evidence to trigger an alert
  #        May lead to false negatives
  evidence_detection_threshold: 0.25

  # Make Slips pop up alerts? Both Linux and Macos
  popup_alerts: false

  # Live score = sum of threat value * confidence, multiplied by the active risk weight.
  # Risk starts low and rises after alerts; the highest reached weight is shared across hosts.
  # These levels are separate from evidence threat levels. Higher weight means more sensitive.
  low_risk_weight: 0.32
  medium_risk_weight: 1
  high_risk_weight: 1.72
  # Generate a live alert when the live score reaches this value.
  # Lower means more sensitive. PCAP/log analysis uses evidence_detection_threshold instead.
  risk_accumulated_threat_level: 5

#############################
modules:
  # List of modules to ignore. By default we always ignore the template,
  # do not remove it from the list
  # Add the names of other modules that you want to disable
  # (use module snake_case names). Example,
  # threat_intelligence, blocking, network_discovery, timeline, virustotal,
  # rnn_cc_detection, feeds_update_manager,
  # ml_linear_model, ml_online_model
  disable:
    - template
    # Numeric beaconing replaces the legacy RNN by default. Remove to compare both.
    - rnn_cc_detection

  # For each line in timeline file there is a timestamp.
  # By default the timestamp is seconds in unix time. However
  # by setting this variable to "true" value the time will be human readable.
  timeline_human_timestamp: true

#############################
llm_proxy:
  # Enable the shared LLM service module.
  enabled: false

  # If a request does not specify a backend alias, this one is used.
  # The value must match one of the keys under backends: below.
  default_backend: local_qwen

  # Number of worker threads processing LLM requests in parallel.
  # All caller modules share the same request queue and the same response
  # channel, so modules must correlate replies by request_id.
  worker_threads: 2

  # Maximum number of pending requests kept in memory.
  queue_size: 100

  # Each backend is a named connection that other modules select by alias through the request field backend.
  backends:
    slips-goldilock:
      # slips-goldilock is the fine-tunned model in Slips for general summary and detection.
      # It is fast enough and good enough
      provider: ollama
      # Default model for this backend alias. Caller modules may override the
      # model in an individual request while still using this connection.
      model: stratosphere/qwen2.5-1.5b-slips-immune-risk:q5_k_m
      base_url: http://127.0.0.1:11434
      # Optional HTTP timeout in seconds.
      timeout: 300

    slips-fast:
      # slips-fast is the fine-tunned model in Slips for fast summary and detection. It has lower quality
      provider: ollama
      # Default model for this backend alias. Caller modules may override the
      # model in an individual request while still using this connection.
      model: stratosphere/qwen2.5-1.5b-slips-immune-risk:q4_k_m
      base_url: http://127.0.0.1:11434
      # Optional HTTP timeout in seconds.
      timeout: 300

    slips-high:
      # slips-high is the fine-tunned model in Slips for high quality. It is slower
      provider: ollama
      # Default model for this backend alias. Caller modules may override the
      # model in an individual request while still using this connection.
      model: stratosphere/qwen2.5-1.5b-slips-immune-risk:q8_0
      base_url: http://127.0.0.1:11434
      # Optional HTTP timeout in seconds.
      timeout: 300


    local_qwen:
      # Supported providers: ollama, openai, anthropic
      provider: ollama
      # Default model for this backend alias. Caller modules may override the
      # model in an individual request while still using this connection.
      model: qwen2.5:3b
      base_url: http://127.0.0.1:11434
      # Optional HTTP timeout in seconds.
      timeout: 300

    openai_default:
      provider: openai
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      # Provide one of api_key, api_key_env, or api_key_file for providers
      # that require authentication.
      api_key_file: config/openai_api_key  # pragma: allowlist secret
      timeout: 60

    claude_default:
      provider: anthropic
      model: claude-sonnet-4-5
      base_url: https://api.anthropic.com
      api_key_file: config/anthropic_api_key   # pragma: allowlist secret
      # Optional Anthropic API version header.
      anthropic_version: 2023-06-01
      timeout: 60

#############################
alert_summary:
  # the llm_proxy parameter must be enabled and configured for alert summaries.
  # Enable the analyst-facing alert summary module.
  enabled: false

  # Write operational logs for this module to:
  # <output-dir>/llm_proxy-summary/alert_summary.log
  # log_verbosity levels:
  # 0 = only create the file
  # 1 = startup, shutdown, and failures
  # 2 = per-alert queueing, requests, writes, and reduction progress
  # 3 = debug details such as prompt-budget decisions
  log_verbosity: 3

  # Preferred LLM backend aliases for alert summaries. If empty, the module
  # falls back to the runtime-ready LLM default backend.
  #allowed_backends: [local_qwen]
  allowed_backends: [slips-goldilock]

  # Keep the sampling conservative because this module writes one analyst
  # summary paragraph per alert.
  llm_temperature: 0.2

  # Token budget for the final analyst summary paragraph.
  llm_max_tokens: 220

  # Hard timeout in seconds for one in-flight shared-LLM request.
  # Large alerts may require several internal reduction requests before the
  # final summary request. If a request times out, the module writes a
  # one-line error entry for that alert. Set to 0 to wait indefinitely.
  llm_response_timeout_seconds: 300

  # Include recent alert history for the same source/profile as extra context
  # in the final analyst-summary prompt.
  history_enabled: true

  # Number of prior summarized alerts kept in memory per profile.
  history_max_alerts: 3

  # Approximate token budget reserved for recent alert history in the final
  # analyst-summary prompt.
  history_max_tokens: 700

  # Number of dominant grouped patterns stored from each prior alert.
  history_patterns_per_alert: 2

#############################
regex_generator:
  # Enable the shared regex generator module.
  enabled: false

  # Create output/regex_generator.log with detailed internal progress logs.
  # This file follows the global parameters.rotation / rotation_period policy.
  create_log_file: true

  # Wait this many seconds between completed generation cycles.
  # Set to 0 to start the next cycle immediately after the previous one
  # finishes and the module is ready again.
  generation_interval_seconds: 0

  # Preferred LLM backend aliases for this module. If empty, the module falls
  # back to the runtime-ready LLM default backend.
  allowed_backends: [local_qwen]

  # Keep the temperature high enough to encourage variation over time.
  llm_temperature: 1.2

  # Token budget for the LLM response. The prompt asks for one regex line only,
  # so this should stay very small.
  llm_max_tokens: 80

  # Soft warning threshold in seconds while waiting for the matching
  # llm_response. The module keeps waiting after this and only logs that the
  # LLM is slow. Set to 0 to disable the warning.
  llm_response_timeout_seconds: 300

  # Prompt history is not sent to the LLM. Repetition is checked locally with a
  # bloom filter plus exact DB lookup, so keep this at 0.
  recent_history_size: 0

  # Reject generated regexes longer than this many characters.
  max_regex_length: 180

  # Hard wall-clock timeout for local regex validation and benign-corpus
  # matching. This prevents one pathological regex from freezing the module.
  # Set to 0 to disable the timeout.
  regex_validation_timeout_seconds: 2

  # Benign match strength threshold from 0 to 100. A generated regex is
  # rejected only when its strongest match against a benign string reaches
  # this score. Higher values are more permissive.
  benign_match_strength_threshold: 75

  # Weighted random choice for the next regex type to generate.
  type_weights:
    dns_domain: 1
    uri: 1
    filename: 1
    tls_sni: 1
    certificate_cn: 1

  # Directory that stores the benign corpus DB and the generated regex DB.
  # Absolute paths are used as-is. Relative paths are resolved inside the
  # output directory of the current Slips run.
  store_dir: output/regex_generator

  # Stable directory for the regex SQLite files. Relative paths are resolved
  # inside parameters.permanent_dir. If set, it takes precedence over
  # store_dir and lets the generator reuse the same DBs across many Slips
  # restarts.
  persistent_store_dir: databases/regex_store

  # Persist rejected regexes in generated_regexes.sqlite.
  # Leave this disabled unless you need audit/debug history, otherwise disk
  # usage will grow with low-value rejected rows.
  store_rejected_regexes: false

  # If rejected regex persistence is enabled, keep at most this many rejected
  # rows and prune older ones first. Set to 0 for unlimited retention.
  max_stored_rejected_regexes: 10000

  # Seed the benign corpus DB once with a small built-in sample for each type.
  # The module also imports domain entries from the configured local whitelist
  # file into the benign corpus on each run for dns_domain, tls_sni, and
  # certificate_cn checks.
  seed_benign_samples: true

#############################
t_cell:
  # Enable the immune-inspired T Cell responder module.
  enabled: false

  # Create output/t_cell.log with human-readable transition logs.
  create_log_file: true

  # Keep ANSI colors in the T Cell log file for quick scanning.
  log_colors: true

  # File log verbosity:
  # 1 = transitions and terminal actions only
  # 2 = add decision summaries such as waiting for co-stimulation/context
  # 3 = add per-evidence debug details such as extracted antigens
  log_verbosity: 3

  # Optional evaluation trace for auditing why thresholds passed or failed.
  # off         = disabled
  # transitions = write detailed traces only when a state transition happens
  # all         = also trace waiting evaluations
  decision_trace_mode: on

  # Separate trace file used only when decision_trace_mode is not off.
  # This path is always resolved inside the selected output directory for the
  # current Slips run. Absolute or outside paths are not honored.
  decision_trace_file: t_cell_trace.jsonl

  # Maximum number of contributing evidence rows stored per contributor list
  # inside the trace file.
  decision_trace_max_evidence: 10

  # Directory that stores the isolated T Cell SQLite database.
  # Absolute paths are used as-is. Relative paths are resolved inside the
  # output directory of the current Slips run.
  store_dir: output/t_cell/data

  # Optional stable directory for the T Cell SQLite database.
  # Leave this empty for normal runs because T Cell state is run-specific.
  # If set, relative paths are resolved inside parameters.permanent_dir.
  persistent_store_dir: ""

  # Keep processed evidence observations for this many seconds.
  observation_retention_seconds: 604800

  # How long a cell remains anergic after a PAMP does not match any accepted
  # regex for its antigen.
  anergy_ttl_seconds: 21600

  # Time window used to count related PAMP observations for the same
  # responsible IP.
  related_lookback_seconds: 3600

  # Saturation point for related PAMP scoring. A value of 5 means that 5 or
  # more related observations contribute the full score.
  related_pamps_saturation: 5

  # Saturation point for weighted profile danger:
  # sum(threat_level_value * confidence) / danger_saturation
  danger_saturation: 2.5

  # DAMP observations also contribute to danger pressure for the same
  # responsible IP. That mixed pressure is used by co-stimulation and
  # context:
  # combined_raw_danger = pamp_raw_danger + damp_danger_weight * damp_raw_danger
  damp_danger_weight: 1.5

  # Base activation threshold for co-stimulation. Signal-specific priming
  # profiles can raise this later for weaker priming sources such as DAMP.
  co_stimulation_threshold: 0.65

  # Co-stimulation weights are normalized internally.
  co_stimulation_weights:
    confidence: 0.35
    related_pamps: 0.25
    danger: 0.40

  # Both PAMP and DAMP can move a mature T Cell into state 1 when an
  # extracted antigen matches an accepted regex. The priming profile
  # determines how strong that state-1 cell is by shifting later
  # thresholds, required supporting evidence counts, and how long the
  # cell can wait before timing out.
  priming_profiles:
    PAMP:
      strength: 1.0
      co_stimulation_threshold_offset: 0.0
      effector_threshold_offset: 0.0
      memory_threshold_offset: 0.0
      state_wait_timeout_factor: 1.0
      effector_min_related_count_offset: 0
      memory_min_related_count_offset: 0
    DAMP:
      strength: 0.6
      co_stimulation_threshold_offset: 0.15
      effector_threshold_offset: 0.10
      memory_threshold_offset: 0.05
      state_wait_timeout_factor: 0.5
      effector_min_related_count_offset: 1
      memory_min_related_count_offset: 1

  # Novelty lookback window used to decide whether a matched regex is new.
  novelty_window_seconds: 86400

  # Recent context window. The previous context window is the immediately
  # preceding window of the same size.
  context_recent_window_seconds: 1800

  # Base context threshold for escalating to the effector state. The
  # effective threshold may be increased by the priming profile.
  effector_threshold: 0.70

  # Base minimum number of related recent observations required before an
  # effector response is allowed. The priming profile may add to this.
  effector_min_related_count: 4

  # Cooldown between effector responses for the same T Cell.
  effector_cooldown_seconds: 1800

  # Base context threshold for moving into the memory state. The effective
  # threshold may be increased by the priming profile.
  memory_threshold: 0.60

  # Maximum recent/previous pressure ratio to consider the threat to be
  # decreasing enough for memory.
  memory_trend_ratio_max: 0.60

  # Base minimum number of related recent observations required before
  # memory is stored. The priming profile may add to this.
  memory_min_related_count: 3

  # If blocking or ARP-poisoning modules are not running, log a simulated
  # effector action instead of publishing new_blocking.
  simulate_effector_without_blocking: true

#############################
ml_linear_model:
  # Standalone sklearn-based ML module.
  mode: test

  # Training startup behavior (used only when mode: train):
  # false -> warm-start from model_load_path/preprocess_load_path (recommended default)
  # true  -> ignore load paths and train from scratch
  train_from_scratch: false

  # Write training/testing metrics logs to output dir.
  # This affects only logging, not training behavior.
  create_performance_metrics_log_files: true

  # Used only when mode: train.
  # If true, each training batch is split into train/validation for metrics.
  validate_on_train: false

  # Used only when validate_on_train is true.
  # Fraction (0.0-1.0) or percent (1-100) of each training batch used for validation.
  validation_percentage: 0.1

  # Number of labeled flows collected before each training/retraining step.
  training_batch_size: 500

  # Reproducibility seed for train/test behavior in this module.
  seed: 1111

  # Optional per-module override for target conversion values.
  # benign_target_value: 0.0
  # malicious_target_value: 1.0

  # Separate log names, so they never overwrite other ML module logs.
  # Final files are: training_<log_suffix>.log and testing_<log_suffix>.log
  log_suffix: ml_linear_model

  # Used only in mode: test.
  # Emit one testing-log snapshot every N processed flows.
  test_log_batch_size: 1000

  # Artifact paths used by modules/ml_linear_model/ml_linear_model.py
  # Load paths point to provided reference artifacts for immediate test/warm-start use.
  model_load_path: modules/ml_linear_model/artifacts/model.bin
  preprocess_load_path: modules/ml_linear_model/artifacts/scaler.bin
  pca_load_path: modules/ml_linear_model/artifacts/pca.bin
  # Store paths point to custom artifacts so training does not overwrite provided ones.
  model_store_path: modules/ml_linear_model/artifacts/model_custom.bin
  preprocess_store_path: modules/ml_linear_model/artifacts/scaler_custom.bin
  pca_store_path: modules/ml_linear_model/artifacts/pca_custom.bin

############################ #
ml_online_model:
  # Standalone river-based ML module.
  mode: test

  # Training startup behavior (used only when mode: train):
  # false -> warm-start from model_load_path/preprocess_load_path (recommended default)
  # true  -> ignore load paths and train from scratch
  train_from_scratch: false

  # Write training/testing metrics logs to output dir.
  # This affects only logging, not training behavior.
  create_performance_metrics_log_files: true

  # Used only when mode: train.
  # If true, each training batch is split into train/validation for metrics.
  validate_on_train: true

  # Used only when validate_on_train is true.
  # Fraction (0.0-1.0) or percent (1-100) of each training batch used for validation.
  validation_percentage: 0.1

  # Number of labeled flows collected before each training/retraining step.
  training_batch_size: 500

  # Reproducibility seed for train/test behavior in this module.
  seed: 1111

  # Optional per-module override for target conversion values.
  # benign_target_value: 0.0
  # malicious_target_value: 1.0

  # Separate log names, so they never overwrite other ML module logs.
  # Final files are: training_<log_suffix>.log and testing_<log_suffix>.log
  log_suffix: ml_online_model

  # Used only in mode: test.
  # Emit one testing-log snapshot every N processed flows.
  test_log_batch_size: 1000

  # Artifact paths used by modules/ml_online_model/ml_online_model.py
  # Load paths point to provided/default artifacts for immediate test/warm-start use.
  model_load_path: modules/ml_online_model/artifacts/model.bin
  preprocess_load_path: modules/ml_online_model/artifacts/scaler.bin
  pca_load_path: modules/ml_online_model/artifacts/pca.bin
  # Store paths point to custom artifacts so training does not overwrite provided ones.
  model_store_path: modules/ml_online_model/artifacts/model_custom.bin
  preprocess_store_path: modules/ml_online_model/artifacts/scaler_custom.bin
  pca_store_path: modules/ml_online_model/artifacts/pca_custom.bin

  # PCA training params (used only in mode: train)
  pca_n_components: 11
  pca_batch_size: 500

#############################
brute_force_detector:
  # Minimum number of SSH attempts from one source to one destination
  # before Slips considers it brute forcing.
  ssh_attempt_threshold: 9

#############################
arp:
  # Seconds of ARP requests considered together, using packet timestamps.
  # Each target expires separately, so old questions cannot inflate a new burst.
  scan_window_seconds: 30

  # Distinct target IPs needed before examining a burst. Retries count once.
  # Reaching this count alone does not generate evidence.
  scan_min_targets: 5

  # Minimum targets without prior successful communication from this device.
  # An ordered search needs this many unfamiliar targets to suggest a scan.
  # With no prior source contacts, this many targets must also be unobserved on the network.
  scan_min_unfamiliar_targets: 10

  # Required share of unfamiliar targets: 0.8 means at least 80%.
  # This prevents a few new neighbours among many familiar ones causing alerts.
  scan_min_unfamiliar_ratio: 0.8

  # This many unfamiliar targets can suggest a scan even in random order.
  # A burst this large without enough scan indicators is informational
  # ARP_DISCOVERY evidence instead; it adds nothing to the alert score.
  scan_broad_targets: 32

  # Required share of successive distinct requests to adjacent IPs (either direction).
  # 0.7 means 70%; this supports smaller ordered sweeps. It is not required for large scans.
  scan_ordered_ratio: 0.7

  # Brief wait after a burst becomes a candidate, allowing observed replies
  # and arriving connection records to add context. Missing records are unknown.
  scan_context_wait_seconds: 3

  # Minimum seconds between findings of the same source device/address/network.
  # A scan can still be reported during an earlier informational discovery cooldown.
  scan_alert_cooldown_seconds: 300

  # Two successful TCP/UDP contacts must be separated by at least these seconds
  # before a neighbour is familiar. Both directions must carry application bytes;
  # ARP requests/replies and empty connection probes never establish familiarity.
  scan_familiar_min_interval_seconds: 300

  # Expire source-to-neighbour history after this many days without successful use.
  # Live history survives restarts and is separated by gateway, subnet and source MAC.
  scan_familiar_retention_days: 30

  # Seconds between private history checkpoints. No disk writes occur per packet.
  # A clean stop saves immediately; a crash can lose this many seconds of learning.
  scan_checkpoint_seconds: 120

  # Maximum source device/address/network groups in memory. Oldest-used groups
  # are discarded at capacity; a warning explains when context has been lost.
  scan_max_sources: 256

  # Maximum target IPs and representative request UIDs kept per source group.
  # At capacity, discard oldest-used targets and mark evidence counts as partial.
  scan_max_targets: 512

  # Maximum successful source-to-neighbour records, and separate sender/UID caches.
  # Old contacts are discarded at capacity; increasing this preserves more history
  # on large networks but uses more memory and checkpoint space.
  scan_max_relationships: 8192

#############################
network_discovery:
  # Detect horizontal scans using distinct destination IPs on the same port.
  # Detection starts immediately; 443 and the first minutes are not exempt.
  # See docs/horizontal_port_scans.md for packet rules and limitations.

  # Seconds covered by the fast scan check, independent of Slips time windows.
  # A short period catches bursts without adding unrelated failures all hour.
  horizontal_fast_window_seconds: 60

  # Distinct new targets needed inside the fast period. Retries count once.
  # Higher values reduce sensitivity to small scans and reconnection bursts.
  horizontal_fast_min_targets: 10

  # Seconds covered by the separate slow scan check. This catches attempts
  # spread over time, including across Slips time-window boundaries.
  horizontal_slow_window_seconds: 1800

  # Distinct new targets needed inside the slow period. A larger count than
  # the fast check avoids treating occasional failed connections as a scan.
  horizontal_slow_min_targets: 25

  # Minimum share of recent distinct targets with failed probes. Successful traffic lowers this share. Does not gate the separate
  # check for short connections to open services without application data.
  horizontal_min_failure_ratio: 0.8

  # Remember successful use of a destination on this port for these seconds.
  # Failed reconnections to it are excluded from NEW-target scan counts until
  # this expires. This is bounded, in-memory context, not a permanent whitelist.
  horizontal_success_history_seconds: 3600

  # Minimum seconds between findings of the same probe kind/source/port.
  # A stronger threat level can be reported immediately during this cooldown.
  horizontal_alert_cooldown_seconds: 300

  # Minimum seconds between full checks of a source/port group. New targets
  # also trigger a check each minimum target count, so a fast burst need not
  # wait for a later flow. Set 0 to check every flow, at higher CPU cost.
  horizontal_evaluation_interval_seconds: 1

  # Maximum network/source/protocol/port groups held in memory. At capacity,
  # discard the least recently used group; its old context is then forgotten.
  horizontal_max_groups: 256

  # Maximum destination IPs remembered per group, including successful ones.
  # Must cover both target thresholds. The oldest used target is discarded
  # at capacity. More targets improve coverage but use more memory and CPU.
  horizontal_max_targets: 256

#############################

#############################
smb_analyzer:
  # Start the SMB behavior detector. It reads Zeek records, not packet bodies.
  enabled: true
  # Record the first read/write per file handle and file closes in new Zeek runs.
  # Needed for executable writes, reported file sizes and rapid file changes.
  log_file_operations: true
  # Keep failed SMB session-setup replies, without logging every SMB command.
  # Needed when NTLM records do not contain a definite authentication result.
  log_authentication_failures: true
  # Treat these TCP destination ports as SMB candidates. Other ports need RPC context.
  ports: [139, 445]
  # Count distinct scanned hosts, shares, failed logins and changed files over this
  # many capture seconds. Shorter periods require more concentrated activity.
  window_seconds: 60
  # Connect scanning with later transfers, and executable writes with later service
  # requests, for this many capture seconds. This is not a training period.
  correlation_seconds: 900
  # Accept records arriving this far behind the newest capture timestamp. Allows
  # parallel parsing and long connections without mixing unrelated days of activity.
  max_lateness_seconds: 1800
  # Require this many distinct SMB targets before calling the behavior a scan.
  scan_min_hosts: 20
  # At least this fraction of those targets must have failed to establish TCP.
  # A successful connection to a busy file server does not count as a failed probe.
  scan_min_failure_ratio: 0.8
  # Broad share access: trigger at this many servers OR this many share names.
  # One ordinary IPC$ or C$ access is insufficient.
  share_min_hosts: 8
  share_min_names: 10
  # Require the same literal IP inside a share path to disagree with this many
  # actual destination IPs. Reduces findings caused by one alias or NAT mapping.
  mismatch_min_hosts: 3
  # Raise suspected propagation only when repeated path mismatches also accompany
  # probing or share access involving this many hosts. No fixed malware IP/domain.
  propagation_min_hosts: 20
  # Report an established SMB session sending OR receiving at least this many
  # bytes. Default is 4 MiB. Ordinary volume is informational; sending this much
  # with recent scanning or repeated mismatched share paths produces the stronger finding.
  large_transfer_bytes: 4194304
  # Report an accessed file whose recorded size reaches this many bytes (100 MiB).
  # Reported file size does not prove the whole file was uploaded or downloaded.
  large_file_bytes: 104857600
  # Require this many distinct connections with explicit authentication failures.
  # Duplicate NTLM/SMB reports for one connection count once. Unknown results,
  # unfinished negotiations and TCP failures are not failed password attempts.
  auth_min_failures: 10
  # Count these SMB session-setup results as rejected credentials. Generic access
  # denial, password expiry and unfinished negotiation are excluded by default.
  authentication_failure_statuses: [LOGON_FAILURE, WRONG_PASSWORD, NO_SUCH_USER]
  # After enough failures, flag possible spraying across this many known accounts
  # OR servers. Password values are unavailable; reuse of one password is unproven.
  spray_min_accounts: 5
  spray_min_hosts: 5
  # Flag a burst affecting this many distinct files. Repeated chunks of one file
  # cannot meet this threshold. Backups and bulk administration can also do this.
  file_change_min_files: 30
  # The stronger possible-ransomware finding requires BOTH this many distinct
  # renamed files and this many files written/deleted during window_seconds.
  # These records cannot establish encryption or see changes made only locally.
  ransomware_min_renames: 20
  ransomware_min_other_changes: 10
  # Recognize these filename suffixes when correlating an executable write with
  # a later remote service request. A filename alone does not prove execution.
  executable_extensions: [.exe, .dll, .scr, .ps1, .bat, .cmd, .vbs, .msi]
  # Approved external SMB servers/subnets, e.g. [203.0.113.10/32]. Suppresses only
  # external-connection findings. Other behaviors still run; use whitelist.conf
  # for evidence-specific exceptions to known authorized activity.
  external_allowed_networks: []
  # Shares used to correlate executable writes with remote service requests.
  admin_shares: [admin$, c$]
  # RPC operations considered service creation/start after an executable write.
  # A request does not prove that Windows successfully executed the service.
  remote_service_operations: [CreateServiceW, CreateServiceA, CreateServiceWOW64W, StartServiceW, StartServiceA]
  # Wait this many capture seconds before repeating the same rule for one source
  # (or source/server for transfer/external/service findings). Limits alert floods.
  cooldown_seconds: 300
  # Recalculate scan counters after this many capture seconds or another
  # scan_min_hosts probes (so a fast burst is detected immediately). SMB
  # share, authentication and file events are evaluated immediately.
  evaluation_interval_seconds: 1
  # Resource ceilings. Evict older context when a ceiling is reached and report
  # that loss of detection context. Raw events already saved on disk remain saved.
  # Most initiating clients tracked at once; older client context is discarded.
  max_sources: 256
  # Most distinct targets, file actions, login results and correlations per client.
  max_events_per_source: 2048
  # Combined observation ceiling across all clients, to bound total memory use.
  max_total_events: 32768
  # Most connection summaries kept while joining SMB operations to their sessions.
  max_sessions: 4096
  # Most source/rule/server repeat timers retained to limit repeated findings.
  max_cooldowns: 4096
  # Each rule can be disabled or assigned a different threat/confidence below.
  # Threat describes the seriousness of the behavior. Confidence describes how
  # strongly the available records establish that behavior, NOT malware probability.
  # Volume alone is info; combined propagation/execution-like behavior is high.
  rules:
    SMB_SCAN: {enabled: true, threat_level: medium, confidence: 0.85}
    SMB_SHARE_SWEEP: {enabled: true, threat_level: medium, confidence: 0.8}
    SMB_SHARE_PATH_MISMATCH: {enabled: true, threat_level: medium, confidence: 0.75}
    SMB_SUSPECTED_PROPAGATION: {enabled: true, threat_level: high, confidence: 0.9}
    SMB_EXTERNAL_CONNECTION: {enabled: true, threat_level: low, confidence: 0.8}
    SMB_LARGE_TRANSFER: {enabled: true, threat_level: info, confidence: 0.95}
    SMB_LARGE_FILE: {enabled: true, threat_level: info, confidence: 0.8}
    SMB_SUSPICIOUS_TRANSFER: {enabled: true, threat_level: high, confidence: 0.85}
    SMB_REMOTE_EXECUTION: {enabled: true, threat_level: high, confidence: 0.85}
    SMB_PASSWORD_GUESSING: {enabled: true, threat_level: medium, confidence: 0.85}
    SMB_PASSWORD_SPRAYING: {enabled: true, threat_level: high, confidence: 0.85}
    SMB_RAPID_FILE_CHANGES: {enabled: true, threat_level: medium, confidence: 0.8}
    SMB_RANSOMWARE_BEHAVIOR: {enabled: true, threat_level: high, confidence: 0.85}

beaconing:
  # Analyze numeric connection timing and sizes. Restart Slips to change this.
  # Disable rnn_cc_detection in modules.disable to avoid running two C2 detectors and TensorFlow.
  enabled: true

  # Connections needed in a channel before judging repetition. More reduces
  # accidental patterns but takes longer to detect slow beacons. Range: 6-512.
  min_connections: 12
  # Recent connections kept per client/server/port/protocol. Older ones are
  # replaced, so changed behavior eventually replaces the old pattern. Range: 12-512.
  window_connections: 128
  # Seconds the observations must span. Prevents a brief burst of requests from
  # appearing to be a sustained beacon; lower for short tests. Range: 0-31536000.
  min_span_seconds: 30.0
  # Shortest repeating interval to examine, in seconds. Smaller values include
  # faster request loops and can find more ordinary application traffic. Range: 0.001-86400.
  min_period_seconds: 0.1
  # Longest repeating interval, in seconds. Daily callbacks need many days of
  # observations; increase retention_hours to cover those observations. Range: 0.001-604800.
  max_period_seconds: 86400.0
  # Allowed timing error as a fraction of one interval: 0.25 permits +/-25%.
  # Larger values tolerate more irregular timing but also match more benign traffic.
  # Range: 0.01-0.45. Applies to start times, delays after replies, and burst starts.
  jitter_tolerance: 0.25
  # Fraction of intervals that must follow the recurring pattern. 0.8 requires
  # 80%. Lower values tolerate interruptions but produce more chance matches.
  # Range: 0.6-1. At least half must still be single, directly observed cycles.
  min_support: 0.8
  # Missing callbacks allowed between observed connections. 2 allows gaps of
  # two or three intervals; larger gaps count against support. Range: 0-4.
  max_missed: 2
  # New connections required between checks. More reduces CPU work but delays
  # discovering a new or changed pattern. Range: 1-128.
  evaluate_every: 4
  # Minimum seconds between checks of one channel. Limits repeated work on fast
  # streams; offline analysis uses packet time. Range: 0-3600.
  evaluate_interval_seconds: 5.0
  # Maximum retained channels. At capacity, older channels are evicted and Slips
  # logs a warning. More retains more endpoints but uses more memory. Range: 16-16384.
  max_channels: 2048
  # Hours of packet history retained across time windows and restarts of this
  # output directory. Expired windows are removed at checkpoint. Range: 1-8760.
  # Must cover max_period_seconds; twelve daily connections need at least 264 hours.
  retention_hours: 72.0
  # Seconds between findings of the same category for one channel. Limits repeated
  # evidence; a suspected-C2 finding can still follow a periodicity finding. Range: 1-2592000.
  alert_cooldown_seconds: 3600.0
  # Seconds between saving changed windows to this run's private SQLite file.
  # More reduces disk work but loses more recent observations after a crash. Range: 5-300.
  flush_interval_seconds: 30.0
  # Reviewed numeric classifier for resemblance to C2 examples. Empty string
  # disables classification while retaining strong-periodicity findings. No pickle is loaded.
  model_file: modules/beaconing/model.json
  # Minimum pattern score for a LOW suspected-C2 finding, never a malware probability.
  # Slips also enforces the model's validation threshold and trained protocols.
  # Raising this reduces findings but misses more C2 examples. Range: 0.5-1.
  c2_score_threshold: 0.5

#############################
anomaly_detection_services:
  # Turn on learning and warnings for new local services, unfamiliar clients,
  # unusual connection hours and lengths. A service is one computer's TCP/UDP port.
  enabled: false
  # auto: learn normal connections, then report unusual ones.
  # train: only learn; use this to teach Slips about legitimate changes.
  # detect: check connections using saved learning; do not accept new habits.
  mode: auto
  # Local timezone for learning usual connection hours, e.g. Europe/Prague.
  # Use your network's timezone so working hours are understood correctly.
  # Changing it clears learned connection hours, but preserves known clients and lengths.
  timezone: UTC
  # Hours learning each local host's usual answering ports, and each service's normal clients.
  # Per-service learning starts at the first reply; host learning starts at first activity.
  # The capture computer starts at capture startup even when quiet. Uses connection start times.
  # 168 = 7 days; 0.0167 is about 1 minute. Client/time/length checks also need
  # min_training_connections and min_training_days, so time alone does not finish their training.
  training_hours: 168
  # Report a local port first seen answering after its host's training window, even if
  # that host had no incoming connections during training. Unanswered probes do not count.
  # Such a port stays unusual until accepted with mode: train. false disables this check.
  detect_new_services: true
  # Maximum local computers whose answering ports are remembered. Bounds memory use;
  # hosts beyond this limit are skipped, rather than judged from incomplete learning.
  max_hosts: 1024
  # Maximum new-service warnings for one host per UTC hour, using connection start times.
  # Limits warning floods across all its ports; other checks use max_alerts_per_service_hour.
  max_new_services_per_host_hour: 10
  # Successful connections needed before client/time/length findings for one service.
  # More connections give Slips more examples; failed attempts cannot teach normality.
  min_training_connections: 30
  # Different UTC dates with successful connections needed for per-service findings.
  # This prevents one busy day from being treated as several days of learning.
  # This, min_training_connections and training_hours must all pass; new-port checks need only hours.
  min_training_days: 3
  # Different local dates with learned connections needed before reporting unusual hours.
  # This gives Slips time to learn when people normally connect; empty days do not count.
  time_min_days: 14
  # For weekday checks, require connections on this many different weekday dates.
  # For weekend checks, require weekend dates instead, so weekday habits do not judge weekends.
  time_min_matching_days: 3
  # Report an unusual hour only when its learned half-hour frequency is below this limit.
  # Higher values report more times as unusual; this is not the chance of an attack.
  time_probability_threshold: 0.01
  # How much learned activity must gather around usual hours before checking unusual hours (0-1).
  # Higher values need a clearer routine, avoiding warnings for irregular hours. 0 checks any routine.
  time_min_concentration: 0.35
  # Normally completed TCP connections needed before checking their length in seconds.
  # More examples give a better idea of usual lengths; UDP and unfinished TCP do not count.
  duration_min_samples: 50
  # Maximum learned TCP connection lengths kept per client and for the whole service.
  # More use more memory and retain older habits; fewer replace old examples sooner.
  # Must be at least duration_min_samples, so enough examples can be kept to start checking.
  duration_samples: 128
  # How far a connection length must differ, relative to the variation in learned lengths.
  # Higher values require a larger difference. This is not a number of seconds or a length ratio.
  duration_zscore: 4.5
  # Extra length check: exceed the learned upper end times this value,
  # or fall below the lower end divided by it. Avoids reporting small length changes.
  duration_ratio: 3
  # Also require this many seconds of difference from the learned lower/upper end.
  # Avoids reporting tiny absolute changes; all three length checks must pass.
  duration_min_difference_seconds: 30
  # Keep learning from successful, usual connections by known clients after initial training.
  # Lets habits change gradually; false stops this learning. mode: train can still accept changes.
  # This does not add unfamiliar clients after training or accept newly active ports.
  adapt_known_clients: true
  # Days of learned connection times kept for the usual-hours check.
  # Limits memory and forgets old schedules; does not delete known clients or learned lengths.
  history_days: 56
  # Forget inactive hosts, answering ports and clients after this many days of connection time.
  # Removes old learning to limit memory and disk use; returning hosts need fresh training.
  # Host activity does not keep every port active: an unused port can expire on an active host.
  retention_days: 90
  # Maximum services with learned clients, and separately the total ports remembered across hosts.
  # Each list has this cap to limit memory. Extra service records are skipped when full.
  # An incomplete host port list stops new-port warnings, so missing learning cannot cause false alarms.
  max_services: 4096
  # Maximum client-to-service records across all services; limits memory.
  # A computer connecting to two services uses two records.
  # An incomplete client list stops unfamiliar-client warnings for the affected service.
  max_clients: 4096
  # Maximum clients remembered for one service; prevents one busy port using all memory.
  # If a client list is incomplete, Slips stops reporting unfamiliar clients for that service.
  max_clients_per_service: 64
  # Seconds of connection timestamps to wait before repeating the same warning
  # for a client/service and combination of reasons. Reduces repeated evidence; 0 disables this wait.
  # For new-service warnings, the wait is per host/port, across all clients.
  alert_cooldown_seconds: 3600
  # Maximum client/hour/length evidence records for one service per UTC hour of connection time.
  # Limits warning floods across clients. New ports use max_new_services_per_host_hour instead.
  max_alerts_per_service_hour: 10
  # Real seconds between saving what Slips has learned to disk.
  # Shorter intervals reduce loss after a crash but cause more disk writes.
  # Normal shutdown also saves learning; this interval does not delay connection checks.
  flush_interval_seconds: 30

#############################
anomaly_detection_https:
  # Hours of observed HTTPS activity per host used to learn normal behavior before warning.
  # Counts closed clock-hour groups with traffic, not empty hours or real time spent running.
  # Use whole numbers. 0 skips this training wait; numerical checks still need min_baseline_points.
  training_hours: 2
  # How to learn normal averages and variation during training:
  # welford gives every training example equal weight; ewma favors recent examples.
  # Choose ewma if normal behavior changes during training and recent examples should matter more.
  training_fit_method: welford
  # Weight of new measurements when training_fit_method is ewma (0.001-1).
  # Higher values change learned averages faster; lower values remember older examples longer.
  # Ignored with welford. 1 uses the newest value for the average; it does not select welford.
  training_alpha: 1

  # How different an hourly HTTPS count or data volume must be from learned behavior to warn.
  # Higher values give fewer warnings; this measures difference relative to usual variation.
  # Used when training has not supplied a learned limit; see empirical_threshold_quantile.
  hourly_zscore_threshold: 3.0
  # How different one connection's byte count to a known server must be to warn.
  # Higher values give fewer byte-count warnings; new-server warnings are separate.
  # Used when no limit was learned for that server; it is not seconds or bytes.
  flow_zscore_threshold: 3.5

  # Largest combined anomaly score treated as a small change when choosing how fast to learn.
  # Higher values allow larger changes to use drift_alpha rather than suspicious_alpha.
  # max_small_flow_anomalies must also pass; this does not decide whether to produce evidence.
  # With ADWIN off, individual-connection updates use the anomaly count alone.
  adaptation_score_threshold: 2.0

  # Weight of new measurements in routine average/variation updates after training (0.001-1).
  # Higher values follow changes faster. With ADWIN enabled, used whenever it finds no lasting change,
  # even if an individual measurement was unusual; without ADWIN, used for normal connections.
  baseline_alpha: 0.5
  # Weight for average/variation updates when a change is classified as small (0.001-1).
  # Lower values accept new habits more slowly; used only after ADWIN reports a change when enabled.
  drift_alpha: 0.05
  # Weight for average/variation updates when a change is classified as suspicious (0-1).
  # Keep small to slow acceptance of suspicious behavior. 0 skips these updates.
  # With ADWIN enabled, used only after it reports a lasting change.
  suspicious_alpha: 0.005

  # Previous measurements needed before checking numerical differences: hours for hourly checks,
  # connections to that server for byte-count checks. More examples reduce early false alarms.
  # This does not delay direct warnings about a new server or a new server TLS fingerprint.
  min_baseline_points: 6

  # Maximum unusual connections in an hour allowed when treating a change as small.
  # For individual connections, also limits the number of unusual reasons treated as small.
  # Higher values allow more anomalies before choosing the slower suspicious_alpha updates.
  max_small_flow_anomalies: 1

  # Use ADWIN, which compares older and newer measurements to find a lasting behavior change.
  # true: choose drift_alpha/suspicious_alpha only after that signal; otherwise use baseline_alpha.
  # false, or missing river package: choose updates directly from anomaly scores/counts.
  # This changes how Slips learns after training, not whether anomaly checks run.
  use_adwin_drift: true
  # How easily ADWIN accepts a difference between older and newer measurements as a change (0.000001-1).
  # Higher values report changes more readily; lower values require stronger evidence of change.
  adwin_delta: 0.01
  # Check for a lasting change every this many measurements; 1 checks each measurement.
  # Higher values reduce checking work but can delay recognizing changed habits.
  # A measurement is one hourly value or one connection value, depending on the check.
  adwin_clock: 1
  # Minimum measurements ADWIN must collect before checking for a lasting change.
  # Higher values wait for more examples and reduce decisions from very little data.
  # This counts measurements, not seconds, and is separate from training_hours.
  adwin_grace_period: 5
  # Minimum measurements in each older/newer group that ADWIN compares.
  # Higher values need more support for a change; lower values react sooner but can mistake noise for change.
  adwin_min_window_length: 5
  # Where to place learned warning limits among differences seen during training.
  # 0.995 uses the 99.5th percentile. Higher values generally give fewer warnings.
  # With fewer than 10 training examples for a check, its fixed zscore threshold is used instead.
  empirical_threshold_quantile: 0.995

  # Used only with training_hours: 0. JA3 is a fingerprint of how client software starts TLS.
  # Minimum hourly total of new client fingerprints across a host's server connections before
  # checking that total for anomalies. Higher values avoid warnings from just a few changes.
  # Despite this key's name, the limit is on the host's hourly total, not each server separately.
  ja3_min_variants_per_server: 3

  # Detail in this module's log: 0 none; 1 warnings, learning changes and start/stop;
  # 2 also hourly summaries; 3 also every connection and learning update.
  # Lower values reduce log volume and disk writes without disabling detection.
  log_verbosity: 3

#############################
virustotal:
  # This is the path to the API key. The file should contain the key at the
  # start of the first line, and nothing more.
  # If no key is found, VT module will not be started.
  api_key_file: config/vt_api_key

  # Update period of virustotal for each IP in the cache
  # The expected value in seconds.
  # 3 day = 259200 seconds
  virustotal_update_period: 259200

#############################
threatintelligence:

  # By default, slips starts without the TI files, and runs the feeds_update_manager
  # in the background. If this option is set to true, slips will not start
  # analyzing the flows until the update manager finished and all TI files are
  # loaded successfully.
  # Putting wait in true is usefull to ensure that slips # doesn't miss the
  # detection of any blacklisted IPs.
  # However, it can take up to 10minutes, so bare that in mind.
  # If you put it in false, Slips will start right away analyzing, and
  # when the update manager finishs it will continue using the TI in case
  # new detections are done.
  # So no detection will be missied, just it will take longer to start if
  # you use true.
  wait_for_TI_to_finish: false

  # Default path to the folder with files holding malcious IPs as defined
  # locally by the user. So the user can define its own malicious TI.
  # All the files in this folder are read and the IPs are considered malicious
  # The format of the files must be, per line:
  # "Number","IP address","Rating","Description"
  # For example:  "1","191.101.31.25","100","NSO IP by Amnesty"
  local_threat_intelligence_files: config/local_ti_files/

  # yamllint disable-line rule:line-length
  # The remote TI files will be temporaly stored in this directory
  download_path_for_remote_threat_intelligence: modules/threat_intelligence/remote_data_files/

  # Update period of threat_intelligence files. How often should Slips update
  # the IoCs.
  # The expected value is in seconds.
  # 1 day = 86400 seconds
  TI_files_update_period: 86400

  # Update period of mac db. How often should we update the db?
  # The expected value in seconds.
  # 1 week = 604800 seconds
  # 2 weeks = 1209600 seconds
  mac_db_update: 1209600
  mac_db: https://maclookup.app/downloads/json-database/get-db

  # File that contains all the preconfigured TI feeds URLs and their
  # threat level.
  # Here is you can find the URLs of the more than 45 TI feeds used by Slips
  ti_files: config/TI_feeds.csv

  # File that contains all the JA3 feeds URLs and their threat level
  # These feeds contain JA3 fingerprints that are identified as malicious.
  ja3_feeds: config/JA3_feeds.csv

  # File that contains all our SHA1 SSL fingerprints feeds and
  # their threat level
  # These feeds contain SHA1 SSL fingerprints that are identified as malicious.
  ssl_feeds: config/SSL_feeds.csv

  # Slips supports an optional RiskIQ feeds as an additional sources of TI data
  # This file should contain your email and your 64 char API key,
  # Each one in it's own line.
  # However, since RiskIQ was bought this is not possible anymore.
  RiskIQ_credentials_path: config/RiskIQ_credentials

  # Update period for RisqIQ is set to 1 week by default, if you're not a premium riskIQ
  # user check your quota limit before changing this value
  # 1 week = 604800 second
  riskiq_update_period: 604800

#############################
whitelists:
  # Used to enable/disable the tranco whitelist https://tranco-list.eu/
  enable_online_whitelist: True
  # Update period of tranco online whitelist. How often should we re-download \
  # and update the list?
  # The expected value is in seconds.
  # 1 day = 86400 seconds
  # 1 week = 604800 seconds
  # 2 weeks = 1209600 seconds
  online_whitelist_update_period: 86400
  online_whitelist: https://tranco-list.eu/download/X5QNN/10000
  # Only store the first N Tranco domains in the database.
  # RegexGenerator and the offline regex coverage report use this limit.
  tranco_top_benign_limit: 1000

  # if this parameter is set to false, Slips runs with no whitelists at all.
  # May cause a lot of false positives
  enable_local_whitelist: True
  # The default path of whitelist.conf,
  # This file is where the user defines what to whitelist or not.
  # It works with
  # IPs, domains, MAC
  # It also works with Organizations such as Microsoft, Twitter, etc.
  # It works by searching the official list of ASN, domains and IPs
  # of those organizations.
  local_whitelist_path: config/whitelist.conf

#############################
flow_alerts:
  # For the flow_alerts module
  # We need a thrshold to determine a long connection in seconds.
  # In Slips by default is 25 minutes
  long_connection_threshold: 1500

  # Detection of successful SSH connections (correct password)
  # Number of bytes sent from 1 IP to another in SSH to trigger an
  # SSH successful alert.
  # This detection belongs to a research of Slips
  ssh_succesful_detection_threshold: 4290

  # For data exfiltration, the threshold in MBs
  data_exfiltration_threshold: 500

  # For DNS over TXT, which is the entropy threshold above which Slips
  # considers any answer as malicious.
  entropy_threshold: 5

  # how many bytes downloaded from pastebin should trigger an alert?
  pastebin_download_threshold: 700

#############################
exporting_alerts:

  # Configuer all the methods Slips will export data with
  # Available options are slack, stix or idmef_manager
  # export_to : [stix] (And a TAXII server)
  # export_to : [slack]
  # export_to : [idmef_manager] (IDMEFv2 HTTPS Server)
  export_to: []

  # IDMEFv2 Manager
  # When "idmef_manager" is in export_to, Slips acts as an IDMEFv2 Analyzer
  # and POSTs each evidence to a Manager over mutual TLS 1.3.
  # For details on the transport and how to set up the certificates, see:
  # https://datatracker.ietf.org/doc/draft-lehmann-idmefv2-https-transport/
  idmef_manager:
    # URL of the IDMEFv2 Manager that Slips should send alerts to.
    url: https://localhost:8443/

    # Mutual TLS material (required). The Manager requires the Analyzer (Slips)
    # to present a client certificate, and Slips validates the Manager against
    # trusted_ca. Certificates must use DNS subjectAltName entries (no
    # wildcards), per the draft. Provide absolute paths (there are no
    # defaults); if any file is missing, IDMEFv2 export is disabled.
    client_certificate: "/path/to/idmef/analyzer.crt"
    client_private_key: "/path/to/idmef/analyzer.key"
    trusted_ca: "/path/to/idmef/ca.crt"

    # Timeout (seconds) for each HTTPS request to the IDMEFv2 Manager.
    timeout: 10

  # Slack
  # In case of Slack export, use this channel to send alerts
  slack_channel_name: proj_slips_alerting_module

  # This name will be used to identify which alert belongs to which device
  # in your slack channel
  sensor_name: sensor1

  # Filepath where the slack token should be
  slack_api_path: config/slack_bot_token_secret

  # Stix
  # Server to use if you enable exporting STIX alerts

  # If slips is running on the host, and docker compose of SlipsWeb is used
  # TAXII_server should be localhost

  # If slips is running in docker container, and docker compose of SlipsWeb is used, and all if them are running inside
  # the same docker network, it should be TAXII_server: 'opentaxii', 'medallion'
  TAXII_server: localhost

  # If your TAXII server is a remote server,
  # you can set the port to 443 or 80.
  port: 1234

  # For Stix, if Slips should use TLS
  use_https: false

  # TAXII 2 discovery endpoint (relative path or full URL)
  discovery_path: /taxii2/

  # TAXII protocol version
  # - 2 (default) for Medallion / TAXII 2.1
  # - 1 for OpenTAXII / TAXII 1.x
  taxii_version: 2

  # Collection (ID or title) on the server you want to push STIX data to
  collection_name: Alerts

  # This value is only used when Slips is running non-stop (e.g with -i )
  # push_delay is the time to wait before pushing STIX data to server
  # (in seconds)
  # If running on a file, not an interface
  # Slips will export to server after analysis is done.
  # 3600s = 1 minute
  push_delay: 3600

  # If true, export each evidence directly to TAXII without writing STIX_data.json
  direct_export: true

  # Number of worker threads for direct TAXII export
  direct_export_workers: 4
  # Upper bound for auto-scaling direct export workers
  direct_export_max_workers: 12
  # Retry settings for direct TAXII export
  # 0 = retry forever (no drops)
  direct_export_retry_max: 0
  direct_export_retry_backoff: 0.5
  direct_export_retry_max_delay: 5.0

  # TAXII server credentials
  taxii_username: admin
  taxii_password: changeme_before_installing_a_medallion_server #  pragma: allowlist secret
  # Timeout for TAXII HTTP requests (seconds)
  taxii_timeout: 10

#############################
cesnet:
  # Slips also supports exporting and importing evidence in the IDEA format to/from
  # warden servers of CESNET organization in Czech Republic.
  send_alerts: false
  receive_alerts: false

  # Warden configuration file. For format instructions check
  # yamllint disable-line rule:line-length
  # https://stratospherelinuxips.readthedocs.io/en/develop/exporting.html?highlight=exporting# cesnet-sharing
  configuration_file: config/warden.conf

  # Time to wait before receiving alerts from warden server (in seconds)
  # By default receive alerts every 1 day
  receive_delay: 86400

#############################
DisabledAlerts:

  # All the following detections are turned on by default
  # Turn them off by adding any of the following detections to the
  # disabled_detections list
  # ARP_SCAN, ARP_DISCOVERY, ARP_OUTSIDE_LOCALNET, UNSOLICITED_ARP, MITM_ARP_ATTACK,
  # YOUNG_DOMAIN, MULTIPLE_SSH_VERSIONS, DIFFERENT_LOCALNET,
  # DEVICE_CHANGING_IP, NON_HTTP_PORT_80_CONNECTION, NON_SSL_PORT_443_CONNECTION
  # WEIRD_HTTP_METHOD, TLS_PROVIDER_IMPERSONATION, DGA_NXDOMAINS, DNS_WITHOUT_CONNECTION,
  # PASTEBIN_DOWNLOAD, CONNECTION_WITHOUT_DNS, DNS_ARPA_SCAN, UNKNOWN_PORT,
  # PASSWORD_GUESSING, HORIZONTAL_PORT_SCAN, CONNECTION_TO_PRIVATE_IP,
  # GRE_TUNNEL, VERTICAL_PORT_SCAN, SSH_SUCCESSFUL, LONG_CONNECTION,
  # SELF_SIGNED_CERTIFICATE, MULTIPLE_RECONNECTION_ATTEMPTS,
  # CONNECTION_TO_MULTIPLE_PORTS, HIGH_ENTROPY_DNS_ANSWER,
  # INVALID_DNS_RESOLUTION, PORT_0_CONNECTION, MALICIOUS_JA3, MALICIOUS_JA3S,
  # DATA_UPLOAD, BAD_SMTP_LOGIN, SMTP_LOGIN_BRUTEFORCE, MALICIOUS_SSL_CERT,
  # ANOMALOUS_FLOW, MALICIOUS_FLOW, SUSPICIOUS_USER_AGENT, EMPTY_CONNECTIONS,
  # INCOMPATIBLE_USER_AGENT, EXECUTABLE_MIME_TYPE, MULTIPLE_USER_AGENT,
  # SMB_SCAN, SMB_SHARE_SWEEP, SMB_SHARE_PATH_MISMATCH, SMB_SUSPECTED_PROPAGATION,
  # SMB_EXTERNAL_CONNECTION, SMB_LARGE_TRANSFER, SMB_LARGE_FILE, SMB_SUSPICIOUS_TRANSFER,
  # SMB_REMOTE_EXECUTION, SMB_PASSWORD_GUESSING, SMB_PASSWORD_SPRAYING,
  # SMB_RAPID_FILE_CHANGES, SMB_RANSOMWARE_BEHAVIOR,
  # HTTP_TRAFFIC, MALICIOUS_JARM, NETWORK_GPS_LOCATION_LEAKED,
  # HTTP_IP_HOST, HTTP_BINARY_POST_WITHOUT_CONTENT_TYPE, HTTP_BINARY_RESPONSE_AS_HTML,
  # ICMP_TIMESTAMP_SCAN, ICMP_ADDRESS_SCAN, ICMP_ADDRESS_MASK_SCAN,
  #  DHCP_SCAN, MALICIOUS_IP_FROM_P2P_NETWORK, P2P_REPORT,
  # COMMAND_AND_CONTROL_CHANNEL, THREAT_INTELLIGENCE_BLACKLISTED_ASN,
  # THREAT_INTELLIGENCE_BLACKLISTED_IP, THREAT_INTELLIGENCE_BLACKLISTED_DOMAIN,
  # MALICIOUS_DOWNLOADED_FILE, MALICIOUS_URL
  # disabled_detections = [THREAT_INTELLIGENCE_BLACKLISTED_IP]
  disabled_detections: []

#############################
EvidenceSignals:

  # Slips adds an evidence_signal field to every evidence centrally when it
  # reaches the shared evidence pipeline. Modules do not need to set it.
  #
  # Allowed values are:
  # - PAMP
  # - DAMP
  #
  # If an evidence type is not listed under overrides, Slips uses
  # default_signal. Unknown or invalid entries also fall back to PAMP.
  default_signal: PAMP

  # Override the evidence signal per evidence type.
  # By default ANOMALOUS_FLOW and MALICIOUS_FLOW are marked as DAMP because
  # they are emitted by anomaly-detection modules. You can also override
  # additional evidence types here.
  overrides:
    PERIODIC_CONNECTION: DAMP
    SUSPECTED_C2_CHANNEL: DAMP
    ANOMALOUS_FLOW: DAMP
    MALICIOUS_FLOW: DAMP
    UNSOLICITED_ARP: DAMP
    CONNECTION_TO_MULTIPLE_PORTS: DAMP
    CONNECTION_TO_PRIVATE_IP: DAMP
    CONNECTION_WITHOUT_DNS: DAMP
    DNS_WITHOUT_CONNECTION: DAMP
    HIGH_ENTROPY_DNS_ANSWER: DAMP
    LONG_CONNECTION: DAMP
    MULTIPLE_RECONNECTION_ATTEMPTS: DAMP
    MULTIPLE_SSH_VERSIONS: DAMP
    NON_SSL_PORT_443_CONNECTION: DAMP
    UNKNOWN_PORT: DAMP
    YOUNG_DOMAIN: DAMP
    HTTP_TRAFFIC: DAMP
    MULTIPLE_USER_AGENT: DAMP
    NON_HTTP_PORT_80_CONNECTION: DAMP
    SSH_SUCCESSFUL: DAMP

#############################
Docker:
  # ID and group id of the user who started to docker container
  # the purpose of using them is to change the ownership of the docker created
  # files to be able to rwx the files from
  # outside docker too, for example the files in the output/ dir
  UID: 0
  GID: 0

#############################
Profiling:
  # CPU profiling
  # enable cpu profiling [true/false]
  # NOTE: the cpu profiler uses port 9001 to show the results.
  cpu_profiler_enable: false

  # Available options are [dev,live]
  # dev for deterministic profiling. this will give precise information
  # about the CPU usage
  # throughout the program runtime. This module cannot give live updates
  # live mode is for sampling data stream. To track the function stack in real
  # time. it is accessible from web interface
  cpu_profiler_mode: dev

  # decides whether the profiler tracks all processes or only one.
  # when this is set to false: The profiler profiles main.py only
  # when it is set to true, it profiles all slips children
  # only used in dev mode [true,false].
  cpu_profiler_multiprocess: true

  # set number of tracer entries (dev mode only)
  # VizTracer uses a circular buffer to store the entries.
  # When there are too many entries, it will only store the latest ones
  # so you know what happened recently.
  # the more the entries, the more RAM viztracer is going to use.
  # https://viztracer.readthedocs.io/en/latest/basic_usage.html#circular-buffer-size
  cpu_profiler_dev_mode_entries: 500000

  # set maximum output lines (live mode only)
  cpu_profiler_output_limit: 20

  # set the wait time between sampling sequences in seconds (live mode only)
  cpu_profiler_sampling_interval: 20

  # enable memory profiling [true,false]
  memory_profiler_enable: false

  # set profiling mode [dev,live]
  memory_profiler_mode: live

  # profile all subprocesses [true,false]
  memory_profiler_multiprocess: true

#############################
web_interface:
  # Enable the local, single-run interface without passing -w.
  enabled: false
  # Listen only on localhost, or on the IPv4 address of the monitored interface.
  # Allowed values: localhost, interface
  bind: localhost
  # Web listener port. Override for one run with ./slips.py -w --web-port 55002.
  port: 55000
  # Require the shared redis/web password to log in before granting access.
  # Only disable this for CI/tests - never on a machine reachable beyond
  # localhost, especially when bind is set to "interface".
  require_password: true

#############################
global_p2p:
   # this is the global p2p's trust model + global P2P
   # network handler combination. can only be enabled when
   # running slips on an interface
   use_global_p2p: False
   iris_conf: config/iris_config.yaml
   # Path relative to the repository root; use a native build on macOS.
   iris_binary: modules/iris/iris
   bootstrapping_node: False
   bootstrapping_modules: ["fides", "iris"]

#############################
local_p2p:
   # create p2p.log with additional info about peer communications?
   create_p2p_logfile : False
   use_p2p : False
   # Dedicated TCP listener. SLIPS does not scan ephemeral ports for P2P.
   listen_port: 6668
   # Authenticated connection records are refreshed by successful activity.
   connection_ttl: 30
   # Briefly hold candidate handshake flows while authentication completes.
   handshake_pending_seconds: 2
   # Peers discover other nodes using this mDNS group name.
   rendezvous: slips
