version: '3.7'
services:
        slips:
                image: stratosphereips/slips:latest
                container_name: Slips
                cap_add:
                  - NET_ADMIN
                volumes:
                  - $PWD/config:/StratosphereLinuxIPS/config/
                  - $PWD/dataset:/StratosphereLinuxIPS/dataset/
                  # persists the generated redis auth password (and web
                  # login hash) across `docker compose down`/`up`, so the
                  # long-lived TI-cache redis-server keeps working after a
                  # container recreation.
                  - $PWD/permanent:/StratosphereLinuxIPS/permanent/
                network_mode: "host"
                entrypoint: ["/bin/bash"]
