name: CI-production-publishing-slips-images

on:
  push:
    branches:
      - 'master'
      - '!develop'

jobs:
  setup:
    runs-on: ubuntu-22.04
    # 2 hours timeout
    timeout-minutes: 120
    outputs:
      slips_version: ${{ steps.get_version.outputs.slips_version }}
      builder_name: ${{ steps.create_builder.outputs.name }}

    steps:
      - name: Get slips version
        id: get_version
        run: |
          ver=$(curl -s https://raw.githubusercontent.com/stratosphereips/StratosphereLinuxIPS/develop/VERSION)
          echo "slips_version=$ver" >> $GITHUB_OUTPUT

      # should come before buildx action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Set up Docker Buildx with docker-container driver is required
      # at the moment to be able to use a subdirectory with Git context
      - name: Create and use Buildx builder
        id: create_builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container  #  allows multi-platform builds
          #  allows you to enable special permissions for the build environment that are normally considered insecure,
          # such as:network.host
          buildkitd-flags: --allow-insecure-entitlement network.host
          name: slips_multi_arch_builder
          use: true

  publish_images:
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      # prevents the whole job from being canceled if one entry fails
      fail-fast: false
      matrix:
        image_type:
          - name: slips
            dockerfile: ./docker/Dockerfile
          - name: slips_light
            dockerfile: ./docker/light/Dockerfile
          - name: slips_dependencies
            dockerfile: ./docker/dependency_image_for_CI/Dockerfile

    steps:
      - name: Use existing Buildx builder
        uses: docker/setup-buildx-action@v4
        with:
          name: slips_multi_arch_builder
          install: true
          use: true

      # clone slips and checkout branch
      # By default it checks out only one commit
      - uses: actions/checkout@v7
        with:
          ref: 'master'
          # Fetch all history for all tags and branches
          fetch-depth: 0
          # submodules are needed for local and global p2p
          submodules: true
          # without this, LFS-tracked files (e.g. ml_online_model/ml_linear_model
          # artifacts) are checked out as pointer text files instead of the
          # real binaries, breaking those models in the published images
          lfs: true

      # actions/checkout's lfs:true fetch/smudge can silently leave LFS
      # pointer text files in place instead of the real binaries (e.g. after
      # a transient LFS download hiccup) without failing the step. Retry the
      # pull until every LFS-tracked file is materialized, and hard-fail
      # before the image is built if it never resolves, so we never publish
      # an image with pointer files instead of real ml_online_model /
      # ml_linear_model artifacts.
      - name: Ensure git-lfs files are fully materialized
        run: |
          set -euo pipefail

          is_pointer() {
            head -c 40 "$1" 2>/dev/null | grep -q "^version https://git-lfs"
          }

          max_attempts=5
          attempt=1
          while :; do
            pending=$(git lfs ls-files -n | while IFS= read -r f; do
              [ -n "$f" ] && is_pointer "$f" && echo "$f"
              true
            done)

            if [ -z "$pending" ]; then
              echo "All LFS-tracked files are materialized."
              break
            fi

            if [ "$attempt" -gt "$max_attempts" ]; then
              echo "::error::The following LFS-tracked files are still pointer files after $max_attempts attempts:"
              echo "$pending"
              exit 1
            fi

            echo "Attempt $attempt/$max_attempts: re-pulling unresolved LFS file(s):"
            echo "$pending"
            git lfs pull || true
            attempt=$((attempt + 1))
            sleep $((attempt * 10))
          done

      - name: Login to DockerHub
        uses: docker/login-action@v4.5.2
        with:
          username: stratosphereips
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push ${{ matrix.image_type.name }} image
        uses: docker/build-push-action@v7
        with:
          allow: network.host
          context: ./
          file: ${{ matrix.image_type.dockerfile }}
          platforms: linux/amd64,linux/arm64
          tags: |
            stratosphereips/${{ matrix.image_type.name }}:latest
            stratosphereips/${{ matrix.image_type.name }}:${{ needs.setup.outputs.slips_version }}
          push: true
