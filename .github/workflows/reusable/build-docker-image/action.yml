name: "Build Docker Image"
description: "Build docker/Dockerfile, export it as an artifact, and expose the image tag"
inputs:
  artifact_name:
    description: "Artifact name for the exported Docker image tarball"
    required: true
  dockerfile:
    description: "Path to the Dockerfile"
    required: false
    default: "docker/Dockerfile"
  image_tag:
    description: "Docker image tag to build and export"
    required: true
outputs:
  artifact_name:
    description: "Artifact name for the exported Docker image tarball"
    value: ${{ inputs.artifact_name }}
  image_tag:
    description: "Docker image tag that was built"
    value: ${{ inputs.image_tag }}

runs:
  using: "composite"
  steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        submodules: recursive
        lfs: true

    # actions/checkout's lfs:true fetch/smudge can silently leave LFS
    # pointer text files in place instead of the real binaries (e.g. after
    # a transient LFS download hiccup) without failing the step. Retry the
    # pull until every LFS-tracked file is materialized, and hard-fail
    # before the image is built if it never resolves, so we never publish
    # an image with pointer files instead of real ml_online_model /
    # ml_linear_model artifacts.
    - name: Ensure git-lfs files are fully materialized
      shell: bash
      run: |
        set -euo pipefail

        is_pointer() {
          head -c 40 "$1" 2>/dev/null | grep -q "^version https://git-lfs"
        }

        max_attempts=5
        attempt=1
        while :; do
          pending=$(git lfs ls-files -n | while IFS= read -r f; do
            [ -n "$f" ] && is_pointer "$f" && echo "$f"
            true
          done)

          if [ -z "$pending" ]; then
            echo "All LFS-tracked files are materialized."
            break
          fi

          if [ "$attempt" -gt "$max_attempts" ]; then
            echo "::error::The following LFS-tracked files are still pointer files after $max_attempts attempts:"
            echo "$pending"
            exit 1
          fi

          echo "Attempt $attempt/$max_attempts: re-pulling unresolved LFS file(s):"
          echo "$pending"
          git lfs pull || true
          attempt=$((attempt + 1))
          sleep $((attempt * 10))
        done

    - name: Validate Docker build context
      shell: bash
      run: |
        test -f iris/go.mod
        test -f iris/go.sum
        test -f p2p4slips/go.mod
        test -f p2p4slips/go.sum

    - name: Build Docker image
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        docker build -t "$IMAGE_TAG" -f "$DOCKERFILE" .
        docker save -o docker-image.tar "$IMAGE_TAG"

    - name: Upload Docker image
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: docker-image.tar
